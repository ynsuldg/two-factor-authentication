<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset password</title>
</head>
<body>

<h1>Reset password</h1>

<p>
    This is a demo reset without email verification. Two-factor authentication stays enabled
    if it was chosen when the account was created.
</p>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form method="post" th:action="@{/reset-password}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div>
        <label>Email</label>
        <input type="email" name="email" required>
    </div>

    <div>
        <label>New password</label>
        <input type="password" name="password" minlength="8" maxlength="72" required>
    </div>

    <div>
        <label>Confirm new password</label>
        <input type="password" name="confirmPassword" minlength="8" maxlength="72" required>
    </div>

    <button type="submit">Reset password</button>
</form>

<p>
    <a th:href="@{/login}">Back to login</a>
</p>

</body>
</html>
