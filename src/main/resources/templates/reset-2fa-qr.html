<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset 2FA</title>
</head>
<body>

<h1>Reset two-factor authentication</h1>

<p>Scan this QR code with your authenticator app.</p>

<div>
    <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code">
</div>

<p>Enter the 6-digit code from the app to confirm. The old code stops working once the new one has been confirmed.</p>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form method="post" th:action="@{/reset-2fa/confirm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div>
        <label>Authentication code</label>
        <input type="text" name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code"
               required>
    </div>

    <button type="submit">Confirm</button>
</form>

<p>
    <a th:href="@{/login}">Cancel</a>
</p>

</body>
</html>
