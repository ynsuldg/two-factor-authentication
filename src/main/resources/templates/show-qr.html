<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Setup 2FA</title>
</head>
<body>

<h1>Setup Two-Factor Authentication</h1>

<p>Scan this QR code with Microsoft Authenticator, Google Authenticator or another authenticator app.</p>

<div>
    <img th:src="'data:image/png;base64,' + ${qrCode}" alt="QR Code">
</div>

<p>Enter the 6-digit code from the app to finish creating your account. The account is not created until the code
    has been confirmed.</p>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form method="post" th:action="@{/register/confirm-2fa}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div>
        <label>Authentication code</label>
        <input type="text" name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code"
               required>
    </div>

    <button type="submit">Create account</button>
</form>

<p>
    <a th:href="@{/register}">Cancel</a>
</p>

</body>
</html>
