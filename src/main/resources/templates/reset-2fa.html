<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset 2FA</title>
</head>
<body>

<h1>Reset two-factor authentication</h1>

<p>
    This is a demo reset for a lost authenticator app. Confirm with your email and password to get a new QR code.
</p>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

<form method="post" th:action="@{/reset-2fa}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div>
        <label>Email</label>
        <input type="email" name="email" required>
    </div>

    <div>
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit">Get new QR code</button>
</form>

<p>
    <a th:href="@{/login}">Back to login</a>
</p>

</body>
</html>
